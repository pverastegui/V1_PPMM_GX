name: Sondear cargadores

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: sondeo
  cancel-in-progress: false

jobs:
  sondear:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sondear la API y actualizar los CSVs
        run: python scripts/sondear.py
      - name: Guardar los cambios en el repo
        run: |
          git config user.name "cargadores-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots data
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "sondeo $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push
          fi