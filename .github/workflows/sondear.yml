name: Sondear cargadores

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: sondeo
  cancel-in-progress: false

jobs:
  sondear:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sondear cada 5 minutos durante 3 horas, guardando cada 30
        run: |
          git config user.name "cargadores-bot"
          git config user.email "actions@users.noreply.github.com"

          FIN=$(( $(date +%s) + 10800 ))

          while [ "$(date +%s)" -lt "$FIN" ]; do
            for i in 1 2 3 4 5 6; do
              python scripts/sondear.py || true
              [ "$(date +%s)" -ge "$FIN" ] && break
              sleep 300
            done

            git add snapshots data
            if git diff --cached --quiet; then
              echo "Sin cambios que guardar en esta media hora."
            else
              git commit -m "sondeo $(date -u +%Y-%m-%dT%H:%MZ)"
              git pull --rebase --autostash origin main || true
              git push || true
            fi
          done