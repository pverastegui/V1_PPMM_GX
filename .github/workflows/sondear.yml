name: Sondear cargadores

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: sondeo
  cancel-in-progress: false

jobs:
  sondear:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sondear cada 5 minutos y guardar al instante
        run: |
          git config user.name "cargadores-bot"
          git config user.email "actions@users.noreply.github.com"

          AHORA=$(date +%s)
          FIN=$(( (AHORA / 10800 + 1) * 10800 - 120 ))
          if [ $(( FIN - AHORA )) -lt 600 ]; then FIN=$(( FIN + 10800 )); fi
          echo "Turno hasta $(date -u -d @$FIN '+%H:%M UTC')"

          while [ "$(date +%s)" -lt "$FIN" ]; do
            python scripts/sondear.py || true

            git add snapshots data
            if git diff --cached --quiet; then
              echo "Sin cambios que guardar."
            else
              git commit -m "sondeo $(date -u +%Y-%m-%dT%H:%MZ)"
              git pull --rebase --autostash origin main || true
              git push || true
            fi

            [ "$(date +%s)" -ge "$FIN" ] && break
            sleep 300
          done