name: Limpiar snapshots viejos

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch: {}

jobs:
  limpiar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Borrar snapshots crudos de mas de 60 dias
        run: python scripts/limpiar_crudos.py
      - name: Guardar los cambios
        run: |
          git config user.name "cargadores-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A snapshots
          if git diff --cached --quiet; then
            echo "Nada que borrar."
          else
            git commit -m "limpieza: snapshots de mas de 60 dias"
            git pull --rebase --autostash origin main || true
            git push
          fi