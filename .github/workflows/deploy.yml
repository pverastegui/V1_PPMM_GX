name: Reconstruir y publicar dashboard

on:
  push:
    branches: [main]
    paths:
      - "data/cargadores.db"
      - "scripts/build_dashboard.py"
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Se mapean los secrets a env para poder preguntar si existen en el `if` de
    # abajo: mientras Cloudflare no este configurado, el paso de publicar se
    # SALTA en vez de fallar, y el workflow queda verde igual.
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build_dashboard.py solo usa la libreria estandar (sqlite3), no necesita
      # pip install. El poller si necesita `requests`, pero eso corre en ingest.yml.
      - name: Generar dist/index.html
        run: python scripts/build_dashboard.py

      # Asi pueden bajar el dashboard desde la pestaña Actions incluso antes de
      # tener Cloudflare configurado (queda como archivo descargable en el run).
      - name: Guardar el dashboard como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dist/index.html
          retention-days: 30

      - name: Publicar en Cloudflare Pages
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cargadores-voltex-monitor
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Aviso si Cloudflare no esta configurado
        if: env.CF_TOKEN == ''
        run: |
          echo "::notice::Dashboard generado OK, pero no se publico: falta configurar"
          echo "::notice::los secrets CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID."
          echo "::notice::Puedes bajarlo desde la seccion Artifacts de este run."